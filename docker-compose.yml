# Lingkungan pengembangan Herbatech ERP.
#   docker compose up -d db            -> hanya database (backend & frontend dijalankan lokal)
#   docker compose --profile app up -d -> semua layanan
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - erp-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      retries: 10

  backend:
    profiles: ["app"]
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/erp
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - erp-files:/data/files

  frontend:
    profiles: ["app"]
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  erp-db:
  erp-files:
