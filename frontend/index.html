<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181B" />
    <title>Herbatech ERP</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318181B'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='17' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('erp.theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.dataset.theme = t;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.dataset.theme = 'dark';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
